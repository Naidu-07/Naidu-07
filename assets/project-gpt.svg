<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" fill="none">
  <defs>
    <filter id="p4-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="p4-thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
  </defs>

  <!-- Card Body with Glow -->
  <rect x="2" y="2" width="776" height="416" rx="18" fill="#070A14" stroke="#7C3AED" stroke-width="1.8" filter="url(#p4-glow)"/>

  <!-- Top Terminal Bar -->
  <rect x="2" y="2" width="776" height="40" rx="18" fill="#0A0E1C"/>
  <rect x="2" y="24" width="776" height="18" fill="#0A0E1C"/>
  <line x1="2" y1="42" x2="778" y2="42" stroke="#581C87" stroke-width="1"/>

  <!-- macOS dots -->
  <circle cx="24" cy="22" r="5.5" fill="#FF5F56"/>
  <circle cx="42" cy="22" r="5.5" fill="#FFBD2E"/>
  <circle cx="60" cy="22" r="5.5" fill="#27C93F"/>

  <!-- Terminal Path -->
  <text x="84" y="27" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="13">~/projects/04-gpt-project</text>

  <!-- Research Status Pill -->
  <rect x="640" y="12" width="118" height="20" rx="10" fill="#3B0764" stroke="#A855F7" stroke-width="1"/>
  <circle cx="652" cy="22" r="3.5" fill="#C084FC"/>
  <text x="662" y="26" fill="#D8B4FE" font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="bold">RESEARCH</text>

  <!-- Project Thumbnail Illustration -->
  <g transform="translate(20, 56)">
    <rect width="740" height="135" rx="12" fill="url(#p4-thumb)" stroke="#6B21A8" stroke-width="1"/>
    
    <!-- Neural Network Synapse Lines -->
    <g stroke="#A855F7" stroke-width="1.2" opacity="0.4">
      <line x1="280" y1="40" x2="350" y2="25"/>
      <line x1="280" y1="40" x2="350" y2="67"/>
      <line x1="280" y1="40" x2="350" y2="110"/>
      <line x1="280" y1="95" x2="350" y2="25"/>
      <line x1="280" y1="95" x2="350" y2="67"/>
      <line x1="280" y1="95" x2="350" y2="110"/>

      <line x1="350" y1="25" x2="420" y2="40"/>
      <line x1="350" y1="25" x2="420" y2="95"/>
      <line x1="350" y1="67" x2="420" y2="40"/>
      <line x1="350" y1="67" x2="420" y2="95"/>
      <line x1="350" y1="110" x2="420" y2="40"/>
      <line x1="350" y1="110" x2="420" y2="95"/>

      <line x1="420" y1="40" x2="490" y2="67"/>
      <line x1="420" y1="95" x2="490" y2="67"/>
    </g>

    <!-- Neural Network Nodes -->
    <!-- Layer 1 -->
    <circle cx="280" cy="40" r="7" fill="#0B0F1F" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="280" cy="95" r="7" fill="#0B0F1F" stroke="#22D3EE" stroke-width="2"/>
    <!-- Layer 2 -->
    <circle cx="350" cy="25" r="7" fill="#0B0F1F" stroke="#A855F7" stroke-width="2"/>
    <circle cx="350" cy="67" r="9" fill="#7C3AED" stroke="#C084FC" stroke-width="2"/>
    <circle cx="350" cy="110" r="7" fill="#0B0F1F" stroke="#A855F7" stroke-width="2"/>
    <!-- Layer 3 -->
    <circle cx="420" cy="40" r="7" fill="#0B0F1F" stroke="#F43F5E" stroke-width="2"/>
    <circle cx="420" cy="95" r="7" fill="#0B0F1F" stroke="#F43F5E" stroke-width="2"/>
    <!-- Layer 4 Output -->
    <circle cx="490" cy="67" r="10" fill="#00FF66" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Token Matrix Overlay Left -->
    <text x="35" y="42" fill="#C084FC" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">TRANSFORMER MODEL // RUNTIME</text>
    <text x="35" y="62" fill="#00FF66" font-family="Consolas, 'SF Mono', monospace" font-size="11">&gt; temperature: 0.7 | top_p: 0.95</text>
    <text x="35" y="82" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="11">&gt; context_length: 128k tokens</text>

    <!-- Token Stream Right -->
    <text x="540" y="55" fill="#38BDF8" font-family="Consolas, 'SF Mono', monospace" font-size="11">[embedding: 1536d]</text>
    <text x="540" y="75" fill="#C084FC" font-family="Consolas, 'SF Mono', monospace" font-size="11">[attention: multi-head]</text>
    <text x="540" y="95" fill="#4ADE80" font-family="Consolas, 'SF Mono', monospace" font-size="11">[output: generated]</text>
  </g>

  <!-- Project Details -->
  <!-- Category Pill -->
  <rect x="24" y="206" width="185" height="22" rx="11" fill="#3B0764" stroke="#A855F7" stroke-width="1"/>
  <text x="34" y="221" fill="#C084FC" font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="bold" letter-spacing="0.5">ARTIFICIAL INTELLIGENCE</text>

  <!-- Project Title -->
  <text x="24" y="254" fill="#FFFFFF" font-family="Consolas, 'SF Mono', monospace" font-size="21" font-weight="bold">04 // GPT PROJECT</text>

  <!-- Description -->
  <text x="24" y="280" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="14">An AI-focused project exploring intelligent digital experiences.</text>

  <!-- Tech Badges -->
  <g transform="translate(24, 304)">
    <rect x="0" y="0" width="115" height="26" rx="13" fill="#0C1428" stroke="#A855F7" stroke-width="1"/>
    <text x="14" y="17" fill="#C084FC" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">AI Workflow</text>

    <rect x="125" y="0" width="130" height="26" rx="13" fill="#0C1428" stroke="#38BDF8" stroke-width="1"/>
    <text x="139" y="17" fill="#38BDF8" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">LLM Interface</text>

    <rect x="265" y="0" width="135" height="26" rx="13" fill="#0C1428" stroke="#00FF66" stroke-width="1"/>
    <text x="279" y="17" fill="#00FF66" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">Prompt Pipeline</text>

    <rect x="410" y="0" width="135" height="26" rx="13" fill="#0C1428" stroke="#FACC15" stroke-width="1"/>
    <text x="424" y="17" fill="#FACC15" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">Intelligent UX</text>
  </g>

  <!-- Card Action Footer -->
  <line x1="24" y1="352" x2="756" y2="352" stroke="#1E1B4B" stroke-width="1"/>
  
  <!-- Buttons in card -->
  <g transform="translate(24, 368)">
    <!-- Repo button placeholder -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#0E1326" stroke="#475569" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="18" y="21" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="13" font-weight="bold">📁 Repo: [Pending]</text>

    <!-- Live Demo button placeholder -->
    <rect x="180" y="0" width="175" height="32" rx="16" fill="#1C1917" stroke="#78716C" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="198" y="21" fill="#D6D3D1" font-family="Consolas, 'SF Mono', monospace" font-size="13" font-weight="bold">🌐 Demo: [In Dev]</text>

    <!-- Terminal Command Hint -->
    <text x="490" y="21" fill="#64748B" font-family="Consolas, 'SF Mono', monospace" font-size="12">status: research / private</text>
  </g>
</svg>