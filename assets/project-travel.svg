<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" fill="none">
  <defs>
    <filter id="p3-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="p3-thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Card Body with Glow -->
  <rect x="2" y="2" width="776" height="416" rx="18" fill="#070A14" stroke="#7C3AED" stroke-width="1.8" filter="url(#p3-glow)"/>

  <!-- Top Terminal Bar -->
  <rect x="2" y="2" width="776" height="40" rx="18" fill="#0A0E1C"/>
  <rect x="2" y="24" width="776" height="18" fill="#0A0E1C"/>
  <line x1="2" y1="42" x2="778" y2="42" stroke="#581C87" stroke-width="1"/>

  <!-- macOS dots -->
  <circle cx="24" cy="22" r="5.5" fill="#FF5F56"/>
  <circle cx="42" cy="22" r="5.5" fill="#FFBD2E"/>
  <circle cx="60" cy="22" r="5.5" fill="#27C93F"/>

  <!-- Terminal Path -->
  <text x="84" y="27" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="13">~/projects/03-travel-website</text>

  <!-- In-Development Status Pill -->
  <rect x="650" y="12" width="108" height="20" rx="10" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="662" cy="22" r="3.5" fill="#F59E0B"/>
  <text x="672" y="26" fill="#FBBF24" font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="bold">IN DEV</text>

  <!-- Project Thumbnail Illustration -->
  <g transform="translate(20, 56)">
    <rect width="740" height="135" rx="12" fill="url(#p3-thumb)" stroke="#065F46" stroke-width="1"/>
    
    <!-- Topographic Contour Lines -->
    <path d="M40 120 Q180 40 320 90 T600 60 T740 100" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.3"/>
    <path d="M0 90 Q150 20 300 70 T580 40 T740 80" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.4"/>
    <path d="M20 70 Q130 10 270 50 T540 30 T740 60" fill="none" stroke="#6EE7B7" stroke-width="1" opacity="0.25"/>

    <!-- Mountain Silhouette Lines -->
    <polygon points="120,135 210,65 290,135" fill="#064E3B" opacity="0.4" stroke="#10B981" stroke-width="1.5"/>
    <polygon points="250,135 370,40 480,135" fill="#047857" opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
    <polygon points="440,135 530,75 620,135" fill="#064E3B" opacity="0.4" stroke="#10B981" stroke-width="1.5"/>

    <!-- Center Compass Rose Vector -->
    <g transform="translate(370, 68)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#38BDF8" stroke-width="1"/>
      <!-- Compass Needles -->
      <polygon points="0,-34 6,-8 0,0 -6,-8" fill="#F43F5E"/>
      <polygon points="0,34 6,8 0,0 -6,8" fill="#94A3B8"/>
      <polygon points="-34,0 -8,-6 0,0 -8,6" fill="#64748B"/>
      <polygon points="34,0 8,-6 0,0 8,6" fill="#64748B"/>
      <circle cx="0" cy="0" r="4" fill="#F8FAFC"/>
      <!-- Coordinates Marks -->
      <text x="-4" y="-38" fill="#F43F5E" font-family="Consolas, 'SF Mono', monospace" font-size="10" font-weight="bold">N</text>
    </g>

    <!-- Geographic Coordinates Overlay -->
    <text x="35" y="42" fill="#34D399" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">EXPEDITION ENGINE // V1.0-BETA</text>
    <text x="35" y="62" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="11">LAT 17.3850° N // LON 78.4867° E</text>
    <text x="35" y="82" fill="#64748B" font-family="Consolas, 'SF Mono', monospace" font-size="11">DESTINATION DISCOVERY &amp; ITINERARY MATRIX</text>
  </g>

  <!-- Project Details -->
  <!-- Category Pill -->
  <rect x="24" y="206" width="180" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="34" y="221" fill="#34D399" font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="bold" letter-spacing="0.5">TRAVEL &amp; EXPLORATION</text>

  <!-- Project Title -->
  <text x="24" y="254" fill="#FFFFFF" font-family="Consolas, 'SF Mono', monospace" font-size="21" font-weight="bold">03 // TRAVEL WEBSITE</text>

  <!-- Description -->
  <text x="24" y="280" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="14">A modern travel discovery and destination exploration website.</text>

  <!-- Tech Badges -->
  <g transform="translate(24, 304)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#0C1428" stroke="#10B981" stroke-width="1"/>
    <text x="14" y="17" fill="#34D399" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">Travel Discovery</text>

    <rect x="150" y="0" width="125" height="26" rx="13" fill="#0C1428" stroke="#38BDF8" stroke-width="1"/>
    <text x="164" y="17" fill="#38BDF8" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">Interactive UI</text>

    <rect x="285" y="0" width="135" height="26" rx="13" fill="#0C1428" stroke="#FACC15" stroke-width="1"/>
    <text x="299" y="17" fill="#FACC15" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">Destination Map</text>

    <rect x="430" y="0" width="145" height="26" rx="13" fill="#0C1428" stroke="#C084FC" stroke-width="1"/>
    <text x="444" y="17" fill="#C084FC" font-family="Consolas, 'SF Mono', monospace" font-size="12" font-weight="bold">Responsive Design</text>
  </g>

  <!-- Card Action Footer -->
  <line x1="24" y1="352" x2="756" y2="352" stroke="#1E1B4B" stroke-width="1"/>
  
  <!-- Buttons in card -->
  <g transform="translate(24, 368)">
    <!-- Repo button placeholder -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#0E1326" stroke="#475569" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="18" y="21" fill="#94A3B8" font-family="Consolas, 'SF Mono', monospace" font-size="13" font-weight="bold">📁 Repo: [Pending]</text>

    <!-- Live Demo button placeholder -->
    <rect x="180" y="0" width="175" height="32" rx="16" fill="#1C1917" stroke="#78716C" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="198" y="21" fill="#D6D3D1" font-family="Consolas, 'SF Mono', monospace" font-size="13" font-weight="bold">🌐 Demo: [In Dev]</text>

    <!-- Terminal Command Hint -->
    <text x="490" y="21" fill="#64748B" font-family="Consolas, 'SF Mono', monospace" font-size="12">status: staging / private</text>
  </g>
</svg>