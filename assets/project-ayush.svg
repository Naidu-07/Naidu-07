
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" fill="none">

  <defs>

    <filter id="p2-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="4"
        flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>

    <filter id="construction-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="p2-thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1F"/>
      <stop offset="100%" stop-color="#241B0E"/>
    </linearGradient>

    <linearGradient id="p2-building" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="p2-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24"
        stroke="#F59E0B" stroke-width="0.5" opacity="0.12"/>
    </pattern>

    <clipPath id="p2-clip">
      <rect width="740" height="135" rx="12"/>
    </clipPath>

  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="776" height="416" rx="18"
    fill="#070A14" stroke="#7C3AED" stroke-width="1.8"
    filter="url(#p2-glow)"/>

  <!-- Terminal Header -->
  <rect x="2" y="2" width="776" height="40" rx="18" fill="#0A0E1C"/>
  <rect x="2" y="24" width="776" height="18" fill="#0A0E1C"/>
  <line x1="2" y1="42" x2="778" y2="42" stroke="#581C87"/>

  <!-- macOS Window Controls -->
  <circle cx="24" cy="22" r="5.5" fill="#FF5F56"/>
  <circle cx="42" cy="22" r="5.5" fill="#FFBD2E"/>
  <circle cx="60" cy="22" r="5.5" fill="#27C93F"/>

  <!-- Terminal Path -->
  <text x="84" y="27" fill="#94A3B8"
    font-family="Consolas, 'SF Mono', monospace"
    font-size="13">~/projects/02-ayush-enterprises</text>

  <!-- Online Status -->
  <rect x="680" y="12" width="78" height="20" rx="10"
    fill="#052E16" stroke="#22C55E"/>

  <circle cx="692" cy="22" r="3.5" fill="#22C55E">
    <animate attributeName="opacity"
      values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="702" y="26" fill="#4ADE80"
    font-family="Consolas, 'SF Mono', monospace"
    font-size="11" font-weight="bold">ONLINE</text>

  <!-- Project Thumbnail -->
  <g transform="translate(20,56)">

    <rect width="740" height="135" rx="12"
      fill="url(#p2-thumb)" stroke="#78350F"/>

    <g clip-path="url(#p2-clip)">

      <!-- Architectural Grid -->
      <rect width="740" height="135" fill="url(#p2-grid)"/>

      <!-- Background Blueprint Waves -->
      <path d="M0 115 Q140 45 280 95 T550 70 T740 100"
        stroke="#F59E0B" stroke-width="1.2" opacity="0.2"/>

      <path d="M0 100 Q150 20 300 80 T590 45 T740 70"
        stroke="#FBBF24" stroke-width="1.2" opacity="0.15"/>

      <path d="M0 130 Q160 75 320 110 T600 95 T740 110"
        stroke="#D97706" stroke-width="1" opacity="0.3"/>

      <!-- Blueprint Corner Markers -->
      <g stroke="#F59E0B" stroke-width="1.5"
        stroke-linecap="round" opacity="0.8">

        <path d="M15 35 V15 H35"/>
        <path d="M705 15 H725 V35"/>
        <path d="M15 100 V120 H35"/>
        <path d="M705 120 H725 V100"/>

      </g>

      <!-- Architectural Scanner -->
      <g transform="translate(500,68)">

        <circle r="58" stroke="#F59E0B"
          stroke-width="0.8" opacity="0.2"/>

        <circle r="50" stroke="#FBBF24"
          stroke-width="1" stroke-dasharray="5 5"
          opacity="0.5">

          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 0 0"
            to="360 0 0"
            dur="25s"
            repeatCount="indefinite"/>

        </circle>

        <path d="M-65 0 H-52 M52 0 H65
                 M0 -65 V-52 M0 52 V65"
          stroke="#F59E0B" opacity="0.5"/>

      </g>

      <!-- Construction Ground Platform -->
      <polygon points="340,108 495,82 690,108 535,133"
        fill="#451A03" fill-opacity="0.4"
        stroke="#D97706" stroke-width="1.2"/>

      <!-- Ground Grid -->
      <g stroke="#F59E0B" stroke-width="0.7" opacity="0.25">

        <path d="M370 103 L565 128
                 M400 98 L595 123
                 M430 93 L625 118
                 M460 88 L655 113"/>

        <path d="M380 113 L535 87
                 M420 118 L575 92
                 M460 123 L615 97
                 M500 128 L655 102"/>

      </g>

      <!-- Main Multi-storey Construction Building -->
      <g stroke="#F59E0B" stroke-width="1.3"
        stroke-linejoin="round">

        <!-- Left Building Face -->
        <polygon points="400,35 465,15 465,95 400,115"
          fill="url(#p2-building)"/>

        <!-- Right Building Face -->
        <polygon points="465,15 535,38 535,118 465,95"
          fill="#451A03" fill-opacity="0.5"/>

        <!-- Top Floor -->
        <polygon points="400,35 465,15 535,38 470,58"
          fill="#D97706" fill-opacity="0.25"/>

        <!-- Horizontal Floor Slabs -->
        <path d="M400 55 L465 35 L535 58
                 M400 75 L465 55 L535 78
                 M400 95 L465 75 L535 98"/>

        <!-- Vertical Structural Columns -->
        <path d="M421 29 V109
                 M443 22 V102
                 M488 23 V103
                 M512 30 V111"/>

        <!-- Front Scaffolding -->
        <g stroke="#FBBF24" stroke-width="0.8" opacity="0.65">

          <path d="M400 35 L421 49 L400 55
                   M421 29 L443 42 L421 49
                   M443 22 L465 35 L443 42"/>

          <path d="M400 55 L421 69 L400 75
                   M421 49 L443 62 L421 69
                   M443 42 L465 55 L443 62"/>

          <path d="M400 75 L421 89 L400 95
                   M421 69 L443 82 L421 89
                   M443 62 L465 75 L443 82"/>

          <path d="M465 35 L488 63 L465 55
                   M488 43 L512 71 L488 63
                   M512 50 L535 78 L512 71"/>

        </g>

        <!-- Structural Anchor Nodes -->
        <g fill="#FBBF24" stroke="none"
          filter="url(#construction-glow)">

          <circle cx="400" cy="35" r="2.5"/>
          <circle cx="465" cy="15" r="2.5"/>
          <circle cx="535" cy="38" r="2.5"/>
          <circle cx="400" cy="115" r="2.5"/>
          <circle cx="535" cy="118" r="2.5"/>

        </g>

      </g>

      <!-- Tower Crane -->
      <g stroke="#FBBF24" stroke-width="1.3"
        stroke-linejoin="round">

        <!-- Crane Foundation -->
        <polygon points="580,112 595,105 615,112 600,120"
          fill="#78350F"/>

        <!-- Vertical Tower -->
        <rect x="590" y="12" width="12" height="101"
          fill="#451A03" fill-opacity="0.5"/>

        <!-- Tower Lattice -->
        <path d="M590 12 L602 24 L590 36
                 L602 48 L590 60 L602 72
                 L590 84 L602 96 L590 108"/>

        <path d="M602 12 L590 24 L602 36
                 L590 48 L602 60 L590 72
                 L602 84 L590 96 L602 108"
          opacity="0.5"/>

        <!-- Crane Operator Cabin -->
        <rect x="602" y="20" width="15" height="13" rx="2"
          fill="#78350F"/>

        <rect x="605" y="23" width="9" height="6"
          fill="#38BDF8" fill-opacity="0.3"
          stroke="#38BDF8" stroke-width="0.6"/>

        <!-- Horizontal Crane Arm -->
        <path d="M490 12 H680 V22 H490Z"
          fill="#451A03" fill-opacity="0.6"/>

        <!-- Crane Arm Lattice -->
        <path d="M490 12 L505 22 L520 12
                 L535 22 L550 12 L565 22
                 L580 12 L595 22 L610 12
                 L625 22 L640 12 L655 22
                 L670 12 L680 22"/>

        <!-- Upper Crane Support -->
        <path d="M595 3 L490 12
                 M595 3 L680 12"
          stroke-width="1"/>

        <!-- Counterweight -->
        <rect x="665" y="22" width="15" height="12"
          fill="#78350F"/>

        <!-- Animated Lifting Hook -->
        <g>

          <line x1="550" y1="22" x2="550" y2="65"
            stroke="#FBBF24" stroke-width="1"/>

          <path d="M550 65 V72 Q550 79 557 75"
            stroke-width="1.8"/>

          <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;0 8;0 0"
            dur="4s"
            repeatCount="indefinite"/>

        </g>

      </g>

      <!-- Construction Material Stack -->
      <g stroke="#F59E0B" stroke-width="1">

        <polygon points="625,97 650,87 685,97 660,107"
          fill="#78350F" fill-opacity="0.6"/>

        <polygon points="625,97 660,107 660,119 625,109"
          fill="#451A03"/>

        <polygon points="660,107 685,97 685,109 660,119"
          fill="#78350F" fill-opacity="0.5"/>

        <path d="M625 103 L660 113 L685 103"/>

        <path d="M637 92 L672 102
                 M649 88 L684 98"
          opacity="0.7"/>

      </g>

      <!-- Blueprint Measurement Lines -->
      <g stroke="#F59E0B" stroke-width="0.8" opacity="0.7">

        <path d="M385 35 V115"/>
        <path d="M380 35 H390 M380 115 H390"/>

        <path d="M400 125 H535"/>
        <path d="M400 121 V129 M535 121 V129"/>

      </g>

      <!-- Animated Blueprint Scan -->
      <line x1="395" y1="35" x2="540" y2="35"
        stroke="#38BDF8" stroke-width="1.2"
        opacity="0.55">

        <animate attributeName="y1"
          values="35;115;35" dur="5s"
          repeatCount="indefinite"/>

        <animate attributeName="y2"
          values="35;115;35" dur="5s"
          repeatCount="indefinite"/>

      </line>

      <!-- Developer HUD Text -->
      <text x="35" y="42" fill="#FBBF24"
        font-family="Consolas, 'SF Mono', monospace"
        font-size="12" font-weight="bold">INDUSTRIAL WEB PLATFORM // V1.0</text>

      <text x="35" y="82" fill="#64748B"
        font-family="Consolas, 'SF Mono', monospace"
        font-size="11">PRODUCT CATALOG &amp; EQUIPMENT SHOWCASE</text>

      <!-- Active Indicator -->
      <circle cx="39" cy="102" r="3" fill="#F59E0B">
        <animate attributeName="opacity"
          values="1;0.3;1" dur="1.5s"
          repeatCount="indefinite"/>
      </circle>

      <text x="49" y="106" fill="#F59E0B"
        font-family="Consolas, 'SF Mono', monospace"
        font-size="10">PLATFORM ACTIVE</text>

    </g>
  </g>

  <!-- Project Category -->
  <rect x="24" y="206" width="185" height="22" rx="11"
    fill="#451A03" stroke="#F59E0B"/>

  <text x="34" y="221" fill="#FBBF24"
    font-family="Consolas, 'SF Mono', monospace"
    font-size="11" font-weight="bold"
    letter-spacing="0.5">CONSTRUCTION &amp; BUSINESS</text>

  <!-- Project Title -->
  <text x="24" y="254" fill="#FFFFFF"
    font-family="Consolas, 'SF Mono', monospace"
    font-size="21" font-weight="bold">02 // AYUSH ENTERPRISES</text>

  <!-- Project Description -->
  <text x="24" y="280" fill="#94A3B8"
    font-family="Consolas, 'SF Mono', monospace"
    font-size="14">A responsive business website for construction materials and equipment.</text>

  <!-- Developer Feature Badges -->
  <g transform="translate(24,304)">

    <!-- Product Catalog -->
    <rect width="130" height="26" rx="13"
      fill="#0C1428" stroke="#F59E0B"/>

    <text x="65" y="17" text-anchor="middle"
      fill="#FBBF24"
      font-family="Consolas, 'SF Mono', monospace"
      font-size="12" font-weight="bold">Product Catalog</text>

    <!-- Interactive UI -->
    <rect x="140" width="125" height="26" rx="13"
      fill="#0C1428" stroke="#38BDF8"/>

    <text x="202.5" y="17" text-anchor="middle"
      fill="#38BDF8"
      font-family="Consolas, 'SF Mono', monospace"
      font-size="12" font-weight="bold">Interactive UI</text>

    <!-- Search and Filters -->
    <rect x="275" width="145" height="26" rx="13"
      fill="#0C1428" stroke="#4ADE80"/>

    <text x="347.5" y="17" text-anchor="middle"
      fill="#4ADE80"
      font-family="Consolas, 'SF Mono', monospace"
      font-size="12" font-weight="bold">Search &amp; Filters</text>

    <!-- Responsive Design -->
    <rect x="430" width="145" height="26" rx="13"
      fill="#0C1428" stroke="#C084FC"/>

    <text x="502.5" y="17" text-anchor="middle"
      fill="#C084FC"
      font-family="Consolas, 'SF Mono', monospace"
      font-size="12" font-weight="bold">Responsive Design</text>

  </g>

</svg>
